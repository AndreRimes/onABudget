name: Build and Push Onabudget Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE: registry.andrerimes.com/andrerimes/onabudget

jobs:
  check:
    uses: ./.github/workflows/check.yaml

  quality:
    needs: check
    uses: ./.github/workflows/sonar.yml
    secrets: inherit

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to local registry
        uses: docker/login-action@v3
        with:
          registry: registry.andrerimes.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Connect to Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="${TS_AUTHKEY}" \
            --accept-routes \
            --hostname="github-onabudget-${{ github.run_id }}"
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Route registry traffic privately
        run: |
          echo "100.97.106.77 registry.andrerimes.com" | sudo tee -a /etc/hosts > /dev/null

          for attempt in {1..30}; do
            status="$(curl --connect-timeout 2 --max-time 3 --silent --output /dev/null --write-out '%{http_code}' http://registry.andrerimes.com/v2/ || true)"
            if [ "${status}" = "401" ]; then
              exit 0
            fi
            sleep 1
          done

          echo "Private registry route did not become ready"
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."registry.andrerimes.com"]
              http = true
              insecure = true

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image through private route
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
